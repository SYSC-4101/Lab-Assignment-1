name: Autograding Tests

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograde:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Install Xvfb (virtual display for JPacman GUI tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and tests pass
        id: tests
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Build and tests pass"
          command: "xvfb-run --auto-servernum ./gradlew test --no-daemon"
          timeout: 10
          max-score: 100

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TESTS_RESULTS: "${{ steps.tests.outputs.result }}"
        with:
          runners: tests
